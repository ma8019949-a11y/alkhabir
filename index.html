<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@500;700;900&family=Reem+Kufi:wght@500;700&family=Tajawal:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
/* =========================================================
   التوكنز (الألوان) — الدارك مود هو الأساس
   ========================================================= */
:root[data-theme="dark"]{
  --bg:#070A13;--bg2:#0B1020;--card:#101829;--cardsolid:#111A2E;--bd:rgba(120,140,200,.16);--bdh:rgba(129,140,248,.5);
  --tx:#F1F5FF;--mu:#93A3C4;--sh:0 18px 40px -18px rgba(0,0,0,.75);--glass:#0A0F1E;
  --lt:#818CF8;
}
:root[data-theme="light"]{
  --bg:#F4F6FC;--bg2:#FFFFFF;--card:#FFFFFF;--cardsolid:#FFFFFF;--bd:rgba(99,102,241,.16);--bdh:rgba(79,70,229,.5);
  --tx:#0F172A;--mu:#5B6A85;--sh:0 18px 40px -20px rgba(79,70,229,.25);--glass:#FFFFFF;
  --lt:#4F46E5;
}
:root{
  --pr:#6366F1;--pr2:#818CF8;--gold:#F5B83D;
  --glow:rgba(99,102,241,.16);
  --grad:linear-gradient(135deg,#6366F1 0%,#7C3AED 55%,#A855F7 100%);
  --ok:#10B981;--okbg:rgba(16,185,129,.12);--dn:#EF4444;--dnbg:rgba(239,68,68,.12);--wn:#F59E0B;--wnbg:rgba(245,158,11,.12);
  --rl:22px;--rm:14px;--ease:cubic-bezier(.22,.8,.3,1);
}
*{box-sizing:border-box;margin:0;padding:0}
html{background:var(--bg)}
html,body{color:var(--tx);font-family:'Tajawal',sans-serif;min-height:100vh;scroll-behavior:smooth}
body{display:flex;flex-direction:column;overflow-x:hidden;background:transparent}
h1,h2,h3,.bt{font-family:'Cairo',sans-serif}
button,input,select,textarea{font-family:inherit;outline:none}
button{transition:transform .2s var(--ease),background .25s,border-color .25s,color .25s,box-shadow .25s,opacity .25s}
button:active:not(:disabled){transform:scale(.96)}
:focus-visible{outline:2px solid var(--pr2);outline-offset:2px}

/* خلفية: حروف عربي بتطلع لفوق ببطء (بتتولّد مرة واحدة برا #app) */
#letters{position:fixed;inset:0;z-index:-1;pointer-events:none;overflow:hidden}
#letters span{position:absolute;bottom:-18vh;font-family:'Reem Kufi','Cairo',sans-serif;font-weight:700;line-height:1;color:var(--lt);opacity:0;animation:rise linear infinite;will-change:transform,opacity}
#letters span.g{color:var(--gold)}
@keyframes rise{0%{transform:translate3d(0,0,0) rotate(var(--r0));opacity:0}12%{opacity:var(--o)}88%{opacity:var(--o)}100%{transform:translate3d(var(--dx),-130vh,0) rotate(var(--r1));opacity:0}}

/* =========================================================
   الشريط العلوي
   ========================================================= */
.topbar{display:flex;align-items:center;justify-content:space-between;padding:12px 26px;background:var(--glass);border-bottom:1px solid var(--bd);position:sticky;top:0;z-index:100;flex-wrap:wrap;gap:10px;animation:dropIn .6s var(--ease) both}
@keyframes dropIn{from{opacity:0;transform:translateY(-100%)}to{opacity:1;transform:none}}
.brand{display:flex;align-items:center;gap:12px}
.logo-img{width:52px;height:52px;border-radius:50%;object-fit:cover;display:block;box-shadow:0 0 0 2px rgba(168,85,247,.55),0 8px 22px -6px rgba(124,58,237,.8);animation:logoPulse 4s ease-in-out infinite;transition:transform .5s var(--ease)}
.logo-img:hover{transform:rotate(-8deg) scale(1.1)}
@keyframes logoPulse{50%{box-shadow:0 0 0 2px rgba(192,132,252,.9),0 8px 30px -4px rgba(168,85,247,.95)}}
.bt{font-size:19px;font-weight:900;letter-spacing:.2px}
.bs{font-size:12px;color:var(--mu)}
.acts{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.badge{background:var(--glow);border:1px solid var(--bd);padding:8px 16px;border-radius:999px;font-size:14px;color:var(--mu)}.badge b{color:var(--tx)}
.ic{width:42px;height:42px;border-radius:var(--rm);border:1px solid var(--bd);background:var(--glow);color:var(--tx);cursor:pointer;font-size:18px}
.ic:hover{border-color:var(--bdh);transform:rotate(18deg) scale(1.08)}
.ghost{background:transparent;border:1px solid var(--bd);color:var(--mu);padding:8px 16px;border-radius:var(--rm);font-weight:700;cursor:pointer}
.ghost:hover{border-color:var(--dn);color:var(--dn);background:var(--dnbg)}
.hb{background:var(--glow);border:1px solid var(--bd);padding:9px 16px;border-radius:var(--rm);cursor:pointer;color:var(--tx);font-weight:700}
.hb:hover{border-color:var(--bdh);box-shadow:0 0 0 4px var(--glow)}

.container{max-width:1150px;margin:0 auto;padding:38px 16px 56px;flex:1;width:100%}
.footer{text-align:center;padding:18px;border-top:1px solid var(--bd);color:var(--mu);font-size:13px;font-weight:700;background:var(--glass);margin-top:auto;letter-spacing:1px}

/* =========================================================
   الصفحة الرئيسية (الهيرو + تسجيل الدخول)
   ========================================================= */
.hero{text-align:center;margin-bottom:34px}
.hero h1{font-family:'Reem Kufi','Cairo',sans-serif;font-size:clamp(30px,6vw,48px);font-weight:700;margin-bottom:12px;line-height:1.35;background:linear-gradient(100deg,var(--tx) 0%,var(--pr2) 35%,#C084FC 55%,var(--gold) 80%,var(--tx) 100%);background-size:250% 100%;-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent;animation:heroIn .9s var(--ease) both,flow 9s linear infinite .9s}
.hero p{color:var(--mu);font-size:16px;max-width:520px;margin:0 auto;animation:heroIn .9s var(--ease) .15s both}
@keyframes heroIn{from{opacity:0;transform:translateY(22px) scale(.98)}to{opacity:1;transform:none}}
@keyframes flow{to{background-position:-250% 0}}

.auth{max-width:470px;margin:0 auto;background:var(--card);border:1px solid var(--bd);border-radius:26px;padding:30px;box-shadow:var(--sh);position:relative;animation:heroIn .9s var(--ease) .3s both}
.auth::before{content:"";position:absolute;inset:-1px;border-radius:27px;padding:1px;background:linear-gradient(140deg,rgba(129,140,248,.7),transparent 35%,transparent 65%,rgba(245,184,61,.5));-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none}
.tabs{display:flex;background:var(--glow);border:1px solid var(--bd);border-radius:var(--rm);padding:5px;margin-bottom:20px;gap:4px}
.tab{flex:1;padding:10px;border-radius:10px;border:1px solid transparent;background:transparent;color:var(--mu);font-weight:700;cursor:pointer}
.tab:hover{color:var(--tx)}
.tab.on{background:var(--grad);color:#fff;box-shadow:0 6px 16px -6px rgba(124,58,237,.8)}

.ig{margin-bottom:14px;flex:1}
.ig label{display:block;font-size:13.5px;color:var(--mu);margin-bottom:6px;font-weight:600}
.ig input,.ig select{width:100%;padding:13px 15px;border-radius:var(--rm);border:1px solid var(--bd);background:var(--glow);color:var(--tx);font-size:15px;transition:border-color .25s,box-shadow .25s,background .25s,transform .25s var(--ease)}
.ig select option{background:var(--cardsolid);color:var(--tx)}
.ig input:focus,.ig select:focus{border-color:var(--pr2);box-shadow:0 0 0 4px var(--glow);transform:translateY(-1px)}
.ig input::placeholder{color:var(--mu);opacity:.6}
.ig input[type=file]{padding:9px}
.row{display:flex;gap:12px;flex-wrap:wrap}

.btn{width:100%;padding:14px;border:none;border-radius:var(--rm);background:var(--grad);background-size:160% 100%;color:#fff;font-weight:900;font-size:16px;cursor:pointer;margin-top:6px;position:relative;overflow:hidden;box-shadow:0 10px 24px -10px rgba(124,58,237,.9)}
.btn::after{content:"";position:absolute;inset:0;background:linear-gradient(115deg,transparent 30%,rgba(255,255,255,.35) 50%,transparent 70%);transform:translateX(-130%);transition:transform .7s var(--ease)}
.btn:hover:not(:disabled){background-position:100% 0;transform:translateY(-2px);box-shadow:0 16px 30px -10px rgba(124,58,237,.95)}
.btn:hover:not(:disabled)::after{transform:translateX(130%)}
.btn:disabled{opacity:.6;cursor:wait}
.sw{text-align:center;margin-top:16px;font-size:14px;color:var(--mu)}
.sw a{color:var(--pr2);cursor:pointer;font-weight:700;position:relative}
.sw a::after{content:"";position:absolute;right:0;bottom:-2px;height:2px;width:0;background:currentColor;transition:width .3s var(--ease)}
.sw a:hover::after{width:100%}

.al{padding:12px 16px;border-radius:var(--rm);font-size:14px;margin-bottom:14px;font-weight:600}
.al.e{background:var(--dnbg);color:#F87171;border:1px solid rgba(239,68,68,.3);animation:shake .45s var(--ease)}
.al.s{background:var(--okbg);color:#34D399;border:1px solid rgba(16,185,129,.3);animation:heroIn .5s var(--ease) both}
@keyframes shake{20%{transform:translateX(7px)}40%{transform:translateX(-7px)}60%{transform:translateX(4px)}80%{transform:translateX(-3px)}}

/* =========================================================
   دروس الطالب
   ========================================================= */
/* نصيحة الطالب */
.tip{display:flex;align-items:center;gap:16px;background:var(--card);border:1px solid var(--bd);border-right:5px solid var(--gold);border-radius:var(--rl);padding:16px 20px;margin-bottom:28px;box-shadow:var(--sh);animation:tipIn .7s var(--ease) both;position:relative;overflow:hidden}
.tip::before{content:"";position:absolute;inset:0;background:linear-gradient(115deg,transparent 35%,rgba(245,184,61,.14) 50%,transparent 65%);transform:translateX(120%);animation:tipShine 6s ease-in-out infinite 1.2s;pointer-events:none}
@keyframes tipIn{from{opacity:0;transform:translateY(-18px)}to{opacity:1;transform:none}}
@keyframes tipShine{0%,55%{transform:translateX(120%)}100%{transform:translateX(-120%)}}
.tip-i{width:46px;height:46px;border-radius:14px;background:rgba(245,184,61,.14);border:1px solid rgba(245,184,61,.4);display:flex;align-items:center;justify-content:center;font-size:23px;flex-shrink:0;animation:bulb 3s ease-in-out infinite}
@keyframes bulb{50%{box-shadow:0 0 0 7px rgba(245,184,61,.12);transform:rotate(-6deg)}}
.tip-b{flex:1;min-width:0}
.tip-t{font-family:'Cairo',sans-serif;font-weight:900;font-size:15px;color:var(--gold);margin-bottom:3px}
.tip-b p{font-size:15.5px;line-height:1.8;font-weight:500}
.tip-n{width:38px;height:38px;border-radius:50%;border:1px solid var(--bd);background:var(--glow);color:var(--mu);font-size:18px;cursor:pointer;flex-shrink:0;position:relative;z-index:1}
.tip-n:hover{color:var(--gold);border-color:var(--gold);transform:rotate(180deg)}

.sh{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:24px;flex-wrap:wrap;gap:10px}
.sh h2{font-size:26px;font-weight:900;position:relative;padding-right:16px}
.sh h2::before{content:"";position:absolute;right:0;top:50%;width:5px;height:70%;transform:translateY(-50%);border-radius:4px;background:var(--grad)}
.sh span{color:var(--mu);font-size:14px}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(275px,1fr));gap:20px}
.lc{background:var(--card);border:1px solid var(--bd);border-radius:var(--rl);padding:24px;display:flex;flex-direction:column;gap:14px;box-shadow:var(--sh);position:relative;overflow:hidden;transition:transform .35s var(--ease),border-color .3s,box-shadow .35s}
.lc::before{content:"";position:absolute;top:0;right:0;left:0;height:3px;background:var(--grad);transform:scaleX(0);transform-origin:right;transition:transform .5s var(--ease)}
.lc:hover{transform:translateY(-6px);border-color:var(--bdh);box-shadow:0 26px 44px -20px rgba(99,102,241,.45)}
.lc:hover::before{transform:scaleX(1)}
.grid .lc{animation:cardIn .55s var(--ease) both}
.grid .lc:nth-child(1){animation-delay:.04s}.grid .lc:nth-child(2){animation-delay:.1s}.grid .lc:nth-child(3){animation-delay:.16s}
.grid .lc:nth-child(4){animation-delay:.22s}.grid .lc:nth-child(5){animation-delay:.28s}.grid .lc:nth-child(n+6){animation-delay:.34s}
@keyframes cardIn{from{opacity:0;transform:translateY(24px) scale(.97)}to{opacity:1;transform:none}}
.num{width:42px;height:42px;border-radius:12px;background:var(--grad);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:900;font-family:'Cairo';box-shadow:0 8px 18px -8px rgba(124,58,237,.9)}
.lc:hover .num{animation:wiggle .6s var(--ease)}
@keyframes wiggle{30%{transform:rotate(-10deg) scale(1.1)}60%{transform:rotate(7deg) scale(1.05)}}
.lc h3{font-size:18px;line-height:1.5}
.mu{font-size:13px;color:var(--mu)}
.st{font-size:13.5px;display:flex;align-items:center;gap:8px;color:var(--mu)}
.dot{width:9px;height:9px;border-radius:50%;background:var(--mu);flex-shrink:0}
.dot.on{background:var(--ok);box-shadow:0 0 10px var(--ok);animation:ping 2s ease-out infinite}
@keyframes ping{0%{box-shadow:0 0 0 0 rgba(16,185,129,.7)}80%,100%{box-shadow:0 0 0 10px rgba(16,185,129,0)}}
.la{margin-top:auto;padding:13px;border-radius:var(--rm);border:1px solid var(--pr);background:var(--glow);color:var(--pr2);font-weight:800;cursor:pointer;font-size:14.5px}
.la:hover{background:var(--grad);color:#fff;border-color:transparent;box-shadow:0 10px 22px -10px rgba(124,58,237,.9);transform:translateY(-2px)}
.la.ok{background:var(--okbg);border-color:var(--ok);color:var(--ok)}
.la.ok:hover{background:var(--ok);color:#fff;box-shadow:0 10px 22px -10px rgba(16,185,129,.9)}
.la.ex{background:var(--wnbg);border-color:var(--wn);color:var(--wn)}
.la.ex:hover{background:var(--wn);color:#1a1200;box-shadow:0 10px 22px -10px rgba(245,158,11,.9)}

/* =========================================================
   النوافذ المنبثقة والدرج الجانبي
   ========================================================= */
.ov{position:fixed;inset:0;background:rgba(3,6,16,.82);z-index:200;display:flex;align-items:center;justify-content:center;padding:20px;animation:fade .3s ease both}
.ov.r{justify-content:flex-end;padding:0;align-items:stretch}
@keyframes fade{from{opacity:0}to{opacity:1}}
.mb{background:var(--cardsolid);border:1px solid var(--bd);border-radius:26px;padding:30px;max-width:440px;width:100%;box-shadow:0 40px 80px -20px rgba(0,0,0,.8);animation:pop .45s var(--ease) both}
@keyframes pop{from{opacity:0;transform:translateY(30px) scale(.9)}to{opacity:1;transform:none}}
.dr{width:380px;max-width:100%;background:var(--cardsolid);padding:24px;overflow:auto;border-right:1px solid var(--bd);animation:slideIn .45s var(--ease) both}
@keyframes slideIn{from{transform:translateX(-100%)}to{transform:none}}
.hi{background:var(--glow);border:1px solid var(--bd);padding:13px 14px;border-radius:var(--rm);margin-bottom:10px;transition:transform .25s var(--ease),border-color .25s}
.hi:hover{transform:translateX(-4px);border-color:var(--bdh)}

/* =========================================================
   مشغل الفيديو والامتحان
   ========================================================= */
.vc{background:var(--card);border:1px solid var(--bd);border-radius:var(--rl);padding:24px;box-shadow:var(--sh);animation:cardIn .6s var(--ease) both}
.vr{position:relative;width:100%;padding-top:56.25%;border-radius:var(--rm);overflow:hidden;background:#000;margin-top:16px;box-shadow:0 0 0 1px var(--bd),0 24px 50px -20px rgba(99,102,241,.5)}
.vr video{position:absolute;inset:0;width:100%;height:100%}
.back{background:none;border:none;color:var(--mu);font-weight:700;cursor:pointer;margin-bottom:16px;font-size:14px;padding:6px 2px}
.back:hover{color:var(--pr2);transform:translateX(5px)}
.fsb{position:absolute;top:10px;left:10px;z-index:3;width:auto;height:auto;background:rgba(0,0,0,.6);color:#fff;border:1px solid rgba(255,255,255,.35);border-radius:999px;padding:8px 16px;font-size:14px;font-weight:700;cursor:pointer}
.fsb:hover{background:rgba(99,102,241,.85)}
.vr.full{position:fixed;inset:0;width:100vw;height:100vh;padding-top:0;margin:0;border-radius:0;z-index:600}
.vr:fullscreen{position:fixed;inset:0;width:100vw;height:100vh;padding-top:0;margin:0;border-radius:0}
.vr:-webkit-full-screen{position:fixed;inset:0;width:100vw;height:100vh;padding-top:0;margin:0;border-radius:0}

/* =========================================================
   لوحة المستر
   ========================================================= */
.dt{display:flex;gap:8px;margin-bottom:24px;border-bottom:1px solid var(--bd);padding-bottom:14px;flex-wrap:wrap}
.dtb{padding:11px 22px;border:1px solid transparent;background:none;color:var(--mu);font-weight:800;cursor:pointer;border-radius:var(--rm)}
.dtb:hover{color:var(--tx);background:var(--glow)}
.dtb.on{background:var(--grad);color:#fff;box-shadow:0 8px 18px -8px rgba(124,58,237,.9)}
.tw{background:var(--card);border:1px solid var(--bd);border-radius:var(--rl);overflow:auto;box-shadow:var(--sh);margin-bottom:20px;animation:cardIn .5s var(--ease) both}
table{width:100%;border-collapse:collapse;font-size:14px;text-align:right}
th,td{padding:14px 16px;border-bottom:1px solid var(--bd);white-space:nowrap}
th{color:var(--mu);background:var(--glow);font-size:13px;font-weight:800}
tbody tr{transition:background .2s}
tbody tr:hover{background:var(--glow)}
tr:last-child td{border-bottom:none}
.pill{padding:4px 12px;border-radius:999px;font-size:12px;font-weight:800}
.pill.student{background:var(--glow);color:var(--pr2)}.pill.parent{background:var(--wnbg);color:var(--wn)}
.add{background:var(--glow);border:2px dashed var(--bd);border-radius:var(--rl);padding:24px;margin-bottom:22px;transition:border-color .3s,background .3s;animation:cardIn .5s var(--ease) both}
.add:hover,.add:focus-within{border-color:var(--bdh)}
.sm{padding:7px 13px;border-radius:9px;border:1px solid var(--pr);background:var(--glow);color:var(--pr2);font-size:13px;font-weight:700;cursor:pointer;margin-left:6px}
.sm:hover{background:var(--pr);color:#fff;transform:translateY(-2px)}
.sm.d{border-color:var(--dn);background:var(--dnbg);color:#F87171}.sm.d:hover{background:var(--dn);color:#fff}
.sm.w{border-color:var(--wn);background:var(--wnbg);color:var(--wn)}.sm.w:hover{background:var(--wn);color:#1a1200}
.empty{text-align:center;padding:54px 20px;color:var(--mu)}
.blk{text-align:center;padding:64px 20px;background:var(--dnbg);border:1px solid rgba(239,68,68,.3);border-radius:var(--rl);animation:pop .6s var(--ease) both}.blk h2{color:var(--dn);margin-bottom:12px}
textarea.cl{width:100%;height:140px;background:var(--glow);color:var(--tx);border:1px solid var(--bd);border-radius:var(--rm);padding:12px;font-family:monospace;margin-top:12px}

/* =========================================================
   معاينة الطباعة (تفضل بيضاء)
   ========================================================= */
.pv{position:fixed;inset:0;background:#fff;color:#000;z-index:500;overflow:auto;padding:24px}
.pv .bar{display:flex;gap:10px;margin-bottom:16px;align-items:center}
.pv h2{margin-bottom:6px}
.cg{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:14px}
.cg div{border:1px dashed #888;padding:10px;text-align:center;font-family:monospace;font-size:16px;letter-spacing:2px;break-inside:avoid}
@media print{.noprint{display:none!important}#app>.topbar,#app>.container,.footer{display:none!important}.pv{position:static;overflow:visible;padding:0}#letters{display:none}}

@media(max-width:600px){.container{padding:18px 8px 40px}.vc{padding:12px;border-radius:16px}.topbar{padding:10px 12px}.auth{padding:20px}.cg{grid-template-columns:repeat(2,1fr)}}

/* أزرار الفيديو */
.fsx{display:none}
.vr.full .fsx,.vr:fullscreen .fsx{display:block}
.vr:-webkit-full-screen .fsx{display:block}
.vbar{display:flex;justify-content:center;margin-top:14px}
.fsb2{background:var(--glow);color:var(--pr2);border:1px solid var(--pr);border-radius:var(--rm);padding:11px 26px;font-size:15px;font-weight:800;cursor:pointer}
.fsb2:hover{background:var(--grad);color:#fff;border-color:transparent;box-shadow:0 10px 22px -10px rgba(124,58,237,.9);transform:translateY(-2px)}
@media(max-width:600px){.fsb2{width:100%;padding:14px;font-size:16px}}

/* احترام إعدادات تقليل الحركة */
@media (prefers-reduced-motion:reduce){
  #letters span{animation:none!important;opacity:.08;bottom:auto;top:var(--y)}
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
}

<script>
/* مولّد حروف الخلفية (منفصل تماماً عن منطق المنصة) */
(function(){
  const L='ابتثجحخدذرزسشصضطظعغفقكلمنهوي'.split('');
  const box=document.getElementById('letters'); if(!box) return;
  const n=innerWidth<600?14:26;
  for(let i=0;i<n;i++){
    const s=document.createElement('span'), st=s.style;
    s.textContent=L[Math.floor(Math.random()*L.length)];
    if(Math.random()<.18) s.className='g';
    st.left=(Math.random()*94).toFixed(1)+'%';
    st.fontSize=(30+Math.random()*80).toFixed(0)+'px';
    st.animationDuration=(28+Math.random()*32).toFixed(1)+'s';
    st.animationDelay='-'+(Math.random()*55).toFixed(1)+'s';
    st.setProperty('--o',(.07+Math.random()*.12).toFixed(2));
    st.setProperty('--dx',((Math.random()-.5)*16).toFixed(1)+'vw');
    st.setProperty('--r0',((Math.random()-.5)*50).toFixed(0)+'deg');
    st.setProperty('--r1',((Math.random()-.5)*90).toFixed(0)+'deg');
    st.setProperty('--y',(Math.random()*88).toFixed(0)+'%');
    box.appendChild(s);
  }
})();
</script>

function h53(str, seed) {
  let h1 = 0xdeadbeef ^ seed, h2 = 0x41c6ce57 ^ seed;
  for (let i = 0; i < str.length; i++) { const c = str.charCodeAt(i); h1 = Math.imul(h1 ^ c, 2654435761); h2 = Math.imul(h2 ^ c, 1597334677); }
  h1 = Math.imul(h1 ^ (h1 >>> 16), 2246822507) ^ Math.imul(h2 ^ (h2 >>> 13), 3266489909);
  h2 = Math.imul(h2 ^ (h2 >>> 16), 2246822507) ^ Math.imul(h1 ^ (h1 >>> 13), 3266489909);
  return (h2 >>> 0).toString(16).padStart(8, '0') + (h1 >>> 0).toString(16).padStart(8, '0');
}

async function loadData() {
  const q = t => sb.from(t).select('*');
  const [p, l, u, v, e] = await Promise.all([
    q('profiles'), q('lessons').order('sort_order').order('created_at'),
    q('unlocks'), q('views').order('viewed_at', { ascending: false }), q('exams')
  ]);
  S.profiles = p.data || []; S.lessons = l.data || []; S.unlocks = u.data || [];
  S.views = v.data || []; S.exams = e.data || [];
  if (S.user.role === 'teacher') {
    const [c, d, r] = await Promise.all([q('codes'), q('devices'), q('reset_requests')]);
    S.codes = c.data || []; S.devices = d.data || []; S.resets = r.data || [];
  }
}

async function loadAll() {
  try {
    const { data: { session } } = await sb.auth.getSession();
    if (session) {
      let p = null;
      for (let i = 0; i < 2 && !p; i++) {
        const r = await sb.from('profiles').select('*').eq('id', session.user.id).single();
        p = r.data;
      }
      if (p) { try { await checkDevice(p); S.user = p; await loadData(); } catch (er) { S.err = er.message; } }
      else S.err = 'تعذر تحميل بيانات حسابك، حدّث الصفحة أو سجّل الدخول تاني.';
    }
    if (!S.user) { const { data } = await sb.rpc('teacher_exists'); S.teacherExists = !!data; }
  } catch (e) { console.error(e); }
  S.loading = false; render();
}

/* ---------- حد الأجهزة (جهازين كحد أقصى) ---------- */
async function checkDevice(p) {
  if (p.role === 'teacher') return;
  const { data, error } = await sb.rpc('register_device', { p_device: DEVICE });
  if (error || data === 'limit') {
    await sb.auth.signOut();
    throw new Error(error ? 'تعذر التحقق من الجهاز، حاول تاني' : 'الحساب ده مسجل على جهازين بالفعل. تواصل مع المستر لو عايز تدخل من جهاز جديد.');
  }
}

async function doLogin(id, pass, wantTeacher) {
  const email = toEmail(id);
  const { data, error } = await sb.auth.signInWithPassword({ email, password: pass });
  if (error) throw new Error('بيانات الدخول غير صحيحة');
  const { data: p } = await sb.from('profiles').select('*').eq('id', data.user.id).single();
  if (!p) { await sb.auth.signOut(); throw new Error('تعذر تحميل ملف المستخدم'); }
  if (wantTeacher !== (p.role === 'teacher')) {
    await sb.auth.signOut();
    throw new Error(wantTeacher ? 'هذا الحساب ليس حساب المستر' : 'استخدم تبويب المستر للدخول');
  }
  await checkDevice(p);
  S.user = p; S.view = 'home'; await loadData();
}

async function doSignup(f) {
  if (!/^\d{8,15}$/.test(f.phone)) throw new Error('رقم الموبايل لازم أرقام فقط');
  if (f.pass.length < 6) throw new Error('كلمة السر لازم 6 حروف/أرقام على الأقل');
  const { data, error } = await sb.auth.signUp({ email: toEmail(f.phone), password: f.pass });
  if (error) throw new Error(/registered/i.test(error.message) ? 'رقم الموبايل ده مسجل قبل كده' : error.message);
  if (!data.session) throw new Error('فعّل تسجيل الدخول بدون تأكيد إيميل من إعدادات Supabase');
  const row = { id: data.user.id, full_name: f.name, role: S.authRole, phone: f.phone };
  if (S.authRole === 'student') { row.grade = f.grade; row.parent_phone = f.parentPhone; }
  else { row.child_name = f.childName; row.child_grade = f.childGrade; }
  const { error: e2 } = await sb.from('profiles').insert(row);
  if (e2) { await sb.auth.signOut(); throw new Error('تعذر إنشاء الحساب: ' + e2.message); }
  await checkDevice(row);
  S.user = row; S.view = 'home'; await loadData();
}

async function doTeacherSignup(u, pass) {
  if (u.length < 2) throw new Error('اسم المستخدم قصير');
  if (pass.length < 6) throw new Error('كلمة السر لازم 6 حروف/أرقام على الأقل');
  const { data, error } = await sb.auth.signUp({ email: toEmail(u), password: pass });
  if (error) throw new Error(/registered/i.test(error.message) ? 'اسم المستخدم ده موجود قبل كده' : error.message);
  if (!data.session) throw new Error('فعّل تسجيل الدخول بدون تأكيد إيميل من إعدادات Supabase');
  const row = { id: data.user.id, full_name: 'الأستاذ عبد المنعم رجب', role: 'teacher', phone: u };
  const { error: e2 } = await sb.from('profiles').insert(row);
  if (e2) { await sb.auth.signOut(); throw new Error('تعذر إنشاء حساب المستر (غالباً موجود فعلاً): ' + e2.message); }
  S.user = row; S.teacherExists = true; S.view = 'home'; await loadData();
}

async function handleStudentAuth(e) {
  e.preventDefault();
  const btn = e.target.querySelector('button[type=submit]'); btn.disabled = true; btn.textContent = 'جاري الدخول...';
  const v = id => {
    let x = ($(id)?.value || '').trim();
    if (/phone/.test(id)) x = x.replace(/[٠-٩]/g, d => '٠١٢٣٤٥٦٧٨٩'.indexOf(d)).replace(/[\s-]/g, '');
    return x;
  };
  try {
    if (S.authMode === 'login') await withTimeout(doLogin(v('f_phone'), $('f_pass').value, false));
    else await doSignup({ name: v('f_name'), phone: v('f_phone'), pass: $('f_pass').value, grade: v('f_grade'),
      parentPhone: v('f_parentphone'), childName: v('f_childname'), childGrade: v('f_childgrade') });
    S.err = ''; S.ok = '';
  } catch (er) { S.err = er.message; }
  render();
}

async function handleTeacherAuth(e) {
  e.preventDefault();
  try {
    const u = $('t_user').value.trim(), p = $('t_pass').value;
    if (S.teacherExists) await withTimeout(doLogin(u, p, true)); else await withTimeout(doTeacherSignup(u, p));
    S.err = '';
  }
  catch (er) { S.err = er.message; }
  render();
}

async function logout() {
  await sb.auth.signOut();

  render();
}

function fsVideo() {
  const el = $('vbox'), d = document;
  if (d.fullscreenElement || d.webkitFullscreenElement) { (d.exitFullscreen || d.webkitExitFullscreen).call(d); return; }
  if (el.classList.contains('full')) { el.classList.remove('full'); return; }
  const req = el.requestFullscreen || el.webkitRequestFullscreen;
  if (req) Promise.resolve(req.call(el)).then(() => { try { screen.orientation.lock('landscape'); } catch (e) {} }).catch(() => el.classList.add('full'));
  else el.classList.add('full');
}
const goHome = () => set({ view: 'home', lessonId: null });

async function submitCode(e) {
  e.preventDefault();
  const code = $('c_code').value.trim();
  const lid = S.codeModal;
  const { data, error } = await sb.rpc('redeem_code', { p_code: code, p_lesson: lid });
  if (error) return set({ codeErr: 'حصل خطأ، حاول تاني' });
  if (data !== 'ok') return set({ codeErr: data === 'used' ? 'الكود ده مستخدم قبل كده' : 'الكود غير صحيح' });
  await loadData(); S.codeModal = null;
  openVideo(lid);
}

async function doneExam() {
  const { error } = await sb.from('exams').upsert(
    { student_id: S.user.id, lesson_id: S.lessonId, submitted: true }, { onConflict: 'student_id,lesson_id' });
  if (error) return alert('حصل خطأ: ' + error.message);
  await loadData(); set({ view: 'home', lessonId: null });
}

async function openVideo(lid) {
  const l = lesson(lid);
  if (!l || !hasUnlock(S.user.id, lid)) return;
  let url = l.video_url || '';
  const dm = url.match(/drive\.google\.com\/.*?(?:\/d\/|[?&]id=)([\w-]+)/);
  if (dm) url = 'https://drive.google.com/file/d/' + dm[1] + '/preview';
  else if (url && !/^https?:/i.test(url)) {
    const { data } = await sb.storage.from('videos').createSignedUrl(url, 60 * 60 * 3);
    url = data?.signedUrl || '';
  }
  await sb.from('views').insert({ student_id: S.user.id, lesson_id: lid });
  await loadData();
  set({ lessonId: lid, view: 'video', videoUrl: url });
}

const toggleDrawer = v => set({ drawer: v });

/* ---------- المستر ---------- */
async function sendReset(e) {
  e.preventDefault();
  const { error } = await sb.from('reset_requests').insert({ phone: $('r_phone').value.trim() });
  S.err = error ? 'تعذر إرسال الطلب، حاول تاني' : '';
  S.ok = error ? '' : 'تم إرسال طلبك. تواصل مع المستر وهيبعتلك كلمة السر الجديدة.';
  render();
}

async function resetPass(id) {
  const p = S.profiles.find(x => x.id === id);
  const np = prompt('كلمة السر الجديدة لـ ' + p.full_name + ' (6 على الأقل):');
  if (!np) return;
  if (np.length < 6) return alert('كلمة السر قصيرة');
  const { error } = await sb.rpc('admin_reset_password', { p_user: id, p_pass: np });
  if (error) return alert('خطأ: ' + error.message);
  await sb.from('reset_requests').delete().eq('phone', p.phone);
  await loadData(); render();
  alert('تم تغيير كلمة السر. سلّمها للطالب.');
}

async function clearDevices(id) {
  if (!confirm('مسح كل أجهزة الحساب ده؟')) return;
  const { error } = await sb.rpc('admin_clear_devices', { p_user: id });
  if (error) return alert(error.message);
  await loadData(); render();
}

async function addLesson(e) {
  e.preventDefault();
  const b = e.target.querySelector('button[type=submit]'); b.disabled = true; b.textContent = 'جاري الحفظ... (الرفع ممكن ياخد وقت)';
  try {
    let url = $('n_url').value.trim();
    const f = $('n_file').files[0];
    if (f) {
      const ext = (f.name.split('.').pop() || 'mp4').replace(/\W/g, '');
      const path = `${Date.now()}.${ext}`;
      const { error } = await sb.storage.from('videos').upload(path, f);
      if (error) throw error;
      url = path;
    }
    if (!url) throw new Error('ارفع فيديو أو اكتب رابط');
    const grade = $('n_grade').value;
    const n = Math.min(500, Math.max(1, +$('n_count').value || 100));
    const { data, error } = await sb.from('lessons').insert({
      title: $('n_title').value.trim(), grade, video_url: url,
      exam_url: $('n_exam').value.trim() || null,
      sort_order: S.lessons.filter(l => l.grade === grade).length + 1
    }).select().single();
    if (error) throw error;
    const codes = new Set();
    while (codes.size < n) codes.add(String(10000000 + Math.floor(Math.random() * 90000000)));
    const { error: e2 } = await sb.from('codes').insert([...codes].map(code => ({ code, lesson_id: data.id })));
    if (e2) throw e2;
    await loadData();
  } catch (er) { alert('خطأ: ' + (er.message || er)); }
  render();
}

async function delLesson(id) {
  if (!confirm('متأكد من حذف الدرس وكل أكواده؟')) return;
  const { error } = await sb.from('lessons').delete().eq('id', id);
  if (error) alert(error.message);
  await loadData(); render();
}

async function toggleBlock(id) {
  const p = S.profiles.find(x => x.id === id);
  await sb.from('profiles').update({ blocked: !p.blocked }).eq('id', id);
  await loadData(); render();
}

async function setNote(id) {
  const p = S.profiles.find(x => x.id === id);
  const n = prompt('ملاحظة لولي الأمر عن الطالب:', p.teacher_note || '');
  if (n === null) return;
  await sb.from('profiles').update({ teacher_note: n }).eq('id', id);
  await loadData(); render();
}

async function setScore(sid, lid) {
  const x = examOf(sid, lid);
  const sc = prompt('درجة الامتحان:', x?.score || '');
  if (sc === null) return;
  await sb.from('exams').upsert({ student_id: sid, lesson_id: lid, submitted: true, score: sc }, { onConflict: 'student_id,lesson_id' });
  await loadData(); render();
}

    <div class="acts">

function App() {
  if (S.loading) return TopBar() + `<div class="container"><div class="empty">جاري تحميل المنصة... ⚡</div></div>`;
  const u = S.user; let body;
  if (!u) body = Landing();
  else if (u.role === 'teacher') body = Teacher();
  else {
    const st = studentOf();
    if (u.blocked || (st && st.blocked)) body = `<div class="blk"><h2>🚫 تم حظر الحساب مؤقتاً</h2><p>تواصل مع الأستاذ عبد المنعم رجب لمعرفة السبب وفك الحظر.</p></div>`;
    else if (u.role === 'parent') body = Parent();
    else if (S.view === 'video') body = VideoView();
    else if (S.view === 'exam') body = ExamView();
    else body = StudentHome();
  }
  return TopBar() + `<div class="container">${body}</div>` + (S.codeModal ? CodeModal() : '') + (S.drawer ? Drawer() : '') + (S.printLesson ? PrintView() : '');
}

function Parent() {
  const st = studentOf();
  if (!st) return `<div class="empty">لم يتم ربط حسابك بحساب طالب بعد. تأكد إن الطالب سجّل برقم موبايلك كولي أمر.</div>`;
  const ls = S.lessons.filter(l => l.grade === st.grade);
  return `<div class="sh"><h2>👨‍👩‍👦 متابعة الطالب: ${esc(st.full_name)}</h2><span>${esc(st.grade)}</span></div>
  <div class="vc" style="margin-bottom:22px"><h3 style="color:var(--pr);font-size:16px;margin-bottom:8px">📌 ملاحظات الأستاذ:</h3>
  <p style="font-weight:600">${esc(st.teacher_note || 'لا توجد ملاحظات حالياً من المستر.')}</p></div>
  <div class="tw"><table><thead><tr><th>#</th><th>الدرس</th><th>فتح الحصة</th><th>وقت الفتح</th><th>آخر مشاهدة</th><th>درجة الامتحان</th></tr></thead><tbody>
  ${!ls.length ? `<tr><td colspan="6" class="empty">لا توجد دروس.</td></tr>` : ls.map((l, i) => {
    const un = hasUnlock(st.id, l.id), ex = examOf(st.id, l.id);
    const last = S.views.find(v => v.student_id === st.id && v.lesson_id === l.id);
    return `<tr><td>${i + 1}</td><td>${esc(l.title)}</td><td>${un ? '✅ مفتوحة' : '🔒 مغلقة'}</td><td>${fmt(un?.unlocked_at)}</td><td>${fmt(last?.viewed_at)}</td>
    <td>${!l.exam_url ? 'لا يوجد' : ex?.score ? esc(ex.score) : (ex?.submitted ? 'تم الحل - بانتظار الدرجة' : 'لم يحل')}</td></tr>`;
  }).join('')}</tbody></table></div>`;
}

function Teacher() {
  const T = (k, t) => `<button class="dtb ${S.dashTab === k ? 'on' : ''}" onclick="set({dashTab:'${k}'})">${t}</button>`;
  const people = S.profiles.filter(p => p.role !== 'teacher');
  let body = '';
  if (S.dashTab === 'users') {
    body = (S.resets.length ? `<div class="al e">🔑 ${S.resets.length} طلب إعادة كلمة سر: ${[...new Set(S.resets.map(r => esc(r.phone)))].join('، ')}</div>` : '') + `<div class="tw"><table><thead><tr><th>الاسم</th><th>النوع</th><th>الموبايل</th><th>الصف</th><th>موبايل ولي الأمر / الابن</th><th>دروس مفتوحة</th><th>الأجهزة</th><th>إجراءات</th></tr></thead><tbody>
    ${!people.length ? `<tr><td colspan="7" class="empty">لا توجد حسابات.</td></tr>` : people.map(p => `<tr>
      <td>${esc(p.full_name)}${p.blocked ? ' 🚫' : ''}${S.resets.some(r => r.phone === p.phone) ? ' 🔑' : ''}</td>
      <td><span class="pill ${p.role}">${p.role === 'student' ? 'طالب' : 'ولي أمر'}</span></td>
      <td dir="ltr">${esc(p.phone)}</td><td>${esc(p.grade || p.child_grade)}</td>
      <td>${esc(p.role === 'student' ? p.parent_phone : p.child_name)}</td>
      <td>${p.role === 'student' ? S.unlocks.filter(u => u.student_id === p.id).length : '—'}</td>
      <td>${S.devices.filter(d => d.user_id === p.id).length}/2</td>
      <td>${p.role === 'student' ? `<button class="sm w" onclick="setNote('${p.id}')">ملاحظة</button>` : ''}
      <button class="sm" onclick="resetPass('${p.id}')">🔑 كلمة سر</button><button class="sm w" onclick="clearDevices('${p.id}')">مسح الأجهزة</button>
      <button class="sm d" onclick="toggleBlock('${p.id}')">${p.blocked ? 'فك الحظر' : 'حظر'}</button></td></tr>`).join('')}
    </tbody></table></div>`;
  } else if (S.dashTab === 'lessons') {
    body = `<form class="add" onsubmit="addLesson(event)"><h3 style="margin-bottom:14px">➕ إضافة درس</h3>
      <div class="row"><div class="ig"><label>عنوان الدرس</label><input required id="n_title"></div>
      <div class="ig"><label>الصف</label>${gradeOpts('n_grade')}</div></div>
      <div class="row"><div class="ig"><label>رفع فيديو</label><input type="file" id="n_file" accept="video/*"></div>
      <div class="ig"><label>رابط Google Drive (أو mp4 مباشر)</label><input id="n_url" dir="ltr" placeholder="https://drive.google.com/file/d/..."></div></div>
      <div class="row"><div class="ig"><label>رابط امتحان جوجل فورم (اختياري)</label><input id="n_exam" dir="ltr"></div>
      <div class="ig"><label>عدد الأكواد</label><input type="number" id="n_count" value="100" min="1" max="500"></div></div>
      <button class="btn" type="submit">حفظ الدرس وتوليد الأكواد</button></form>
      ${S.lessons.map(l => {
        const cs = S.codes.filter(c => c.lesson_id === l.id), free = cs.filter(c => !c.used_by);
        return `<div class="lc" style="margin-bottom:14px"><div style="display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px">
        <div><h3>${esc(l.title)}</h3><div class="mu">${esc(l.grade)} • الأكواد: ${free.length} متاح / ${cs.length - free.length} مستخدم</div></div>
        <div><button class="sm" onclick="set({showCodes:S.showCodes==='${l.id}'?null:'${l.id}'})">الأكواد</button>
        <button class="sm w" onclick="set({printLesson:'${l.id}'})">📄 PDF</button>
        <button class="sm d" onclick="delLesson('${l.id}')">حذف</button></div></div>
        ${S.showCodes === l.id ? `<textarea class="cl" readonly>${free.map(c => c.code).join('\n')}</textarea>` : ''}</div>`;
      }).join('') || '<div class="empty">لا توجد دروس.</div>'}`;
  } else {
    body = `<div class="tw"><table><thead><tr><th>الطالب</th><th>الدرس</th><th>الحالة</th><th>الدرجة</th><th></th></tr></thead><tbody>
    ${!S.exams.length ? `<tr><td colspan="5" class="empty">لا توجد امتحانات مسلّمة.</td></tr>` : S.exams.map(x => `<tr>
      <td>${esc(S.profiles.find(p => p.id === x.student_id)?.full_name)}</td><td>${esc(lesson(x.lesson_id)?.title)}</td>
      <td>${x.submitted ? 'تم الحل' : '—'}</td><td>${esc(x.score || '—')}</td>
      <td><button class="sm" onclick="setScore('${x.student_id}','${x.lesson_id}')">إدخال الدرجة</button></td></tr>`).join('')}
    </tbody></table></div>`;
  }
  return `<div class="sh"><h2>لوحة المستر</h2><span>${people.length} حساب مسجل</span></div>
  <div class="dt">${T('users', '👥 الحسابات')}${T('lessons', '🎬 الدروس والأكواد')}${T('exams', '📝 الامتحانات')}</div>${body}`;
}

loadAll();
</script>
</body>
</html>
